name: Release Build & Upload

on:
  workflow_dispatch:

env:
  APP_NAME: Jentacular
  BUNDLE_ID: com.hitvpn.hitvpn2026
  VERSION: "1.1"
  BUILD: "139"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep "Xcode"
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Decode certificates
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}" | base64 --decode > /tmp/distribution.p12
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Import certificate
        run: |
          KEYCHAIN_PASSWORD="build_keychain_123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/distribution.p12 -P "${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          echo "Provisioning Profile UUID: $UUID"
          mv ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Diagnose provisioning profile entitlements
        run: |
          echo "=== Decoding provisioning profile ==="
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile_decoded.plist
          echo "=== Entitlements ==="
          /usr/libexec/PlistBuddy -c "Print Entitlements" /tmp/profile_decoded.plist
          echo "=== App ID ==="
          /usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /tmp/profile_decoded.plist
          echo "=== VPN API ==="
          /usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.developer.networking.vpn.api" /tmp/profile_decoded.plist 2>&1 || echo "VPN API NOT FOUND in profile!"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Jentacular.xcodeproj \
            -scheme Jentacular \
            -configuration Release \
            -archivePath $PWD/build/Jentacular.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="hitvpn2026_AppStore_NewCert0930" \
            CODE_SIGN_STYLE=Manual \
            MARKETING_VERSION=1.1 \
            CURRENT_PROJECT_VERSION=${{ env.BUILD }}

      - name: Export IPA
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.hitvpn.hitvpn2026</key>
                  <string>hitvpn2026_AppStore_NewCert0930</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Jentacular.xcarchive \
            -exportPath $PWD/build/export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jentacular-IPA
          path: build/export/*.ipa

      - name: Get IPA size
        run: |
          IPA_FILE=$(ls build/export/*.ipa | head -1)
          echo "IPA file: $IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Upload to App Store Connect
        run: |
          set -e
          xcrun altool --upload-app \
            --type ios \
            --file build/export/Jentacular.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --verbose 2>&1 | tee upload_log.txt
          if grep -q "UPLOAD SUCCEEDED\|No errors" upload_log.txt; then
            echo "Upload successful!"
          else
            echo "Upload failed!"
            cat upload_log.txt
            exit 1
          fi
