name: Jentacular
options:
  bundleIdPrefix: com.hitvpn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Jentacular:
    type: application
    platform: iOS
    sources:
      - path: Jentacular
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitvpn.hitvpn2026
        PRODUCT_NAME: Jentacular
        INFOPLIST_FILE: Jentacular/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jentacular/Resources/Jentacular.entitlements
    info:
      path: Jentacular/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jentacular vpn
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
